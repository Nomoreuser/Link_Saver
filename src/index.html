<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Saver</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="top">
        <div class="title">
            <span></span>
            <p>Link Saver</p>
        </div>

        <div class="circles"><span></span><span></span><span></span></div>
    </div>

    <div id="ttt" style="position: fixed; background-color: blue; padding: 5px; color: aliceblue;"></div>
    <main id="main">
        <div class="greet">
            <p>
                Welcome to Link Saver! <br>
                Store and manage your favorite links.
            </p>
        </div>

        <div id="terminal">
            <div id="res"></div>
            <div id="inputHolder">
                <span id="text"></span>
                <!-- <span id="cursor"></span> -->
            </div>
            
        </div>
        <input id="hinput" autofocus type="search" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
        
    </main>

    <!-- <button onclick="alert('hi')">oo</button> -->
    <script src="script.js"></script>
</body>
</html>
